name: Runbook or skill request
description: Propose a missing symptom, runbook or skill
labels: ["content"]
body:
  - type: input
    id: symptom
    attributes:
      label: Symptom
      description: The phrase an L3 engineer would search for.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [collection, platform, boot, kernel, memory, storage, network, hardware, cluster, tracing]
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Artifacts and tools involved
      description: For example vmcore, supportconfig, perf data, crash, bpftrace.
  - type: textarea
    id: sources
    attributes:
      label: Primary sources you know of
      description: Official docs or upstream links; blogs are fine as leads.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: Applies to enterprise RHEL, SLES or Debian/Ubuntu releases listed in the README
          required: true
